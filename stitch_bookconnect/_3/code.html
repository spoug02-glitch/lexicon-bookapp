</div>
</div>
</div>
<div class="flex flex-col gap-stack-sm w-full">
<label class="text-label-md text-on-surface-variant uppercase tracking-wider font-semibold">획득 경로</label>
<div class="flex flex-wrap gap-stack-sm" id="acquisition-chips">
<button class="acq-chip px-4 py-2 bg-surface-container text-on-surface rounded-full text-body-md transition-colors border border-transparent hover:border-primary/20 hover:bg-surface-container-high focus:outline-none" data-value="library">도서관</button>
<button class="acq-chip px-4 py-2 bg-surface-container text-on-surface rounded-full text-body-md transition-colors border border-transparent hover:border-primary/20 hover:bg-surface-container-high focus:outline-none" data-value="subscription">구독</button>
<button class="acq-chip px-4 py-2 bg-surface-container text-on-surface rounded-full text-body-md transition-colors border border-transparent hover:border-primary/20 hover:bg-surface-container-high focus:outline-none" data-value="online">온라인</button>
<button class="acq-chip px-4 py-2 bg-surface-container text-on-surface rounded-full text-body-md transition-colors border border-transparent hover:border-primary/20 hover:bg-surface-container-high focus:outline-none" data-value="offline">오프라인</button>
</div>
</div>
<div class="flex flex-col gap-stack-sm w-full hidden" id="sub-path-section">
<label class="text-label-md text-on-surface-variant uppercase tracking-wider font-semibold" id="sub-path-label">제공처</label>
<div class="flex flex-wrap gap-stack-sm mb-2" id="sub-path-chips"></div>
<div class="relative w-full group">
<div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
<span class="material-symbols-outlined text-on-surface-variant text-[20px]">search</span>
</div>
<input class="w-full bg-[#F1F5F9] text-on-surface pl-10 pr-4 py-3 rounded-xl text-body-md focus:outline-none focus:ring-1 focus:ring-primary focus:bg-surface transition-all placeholder:text-on-surface-variant/50 border border-transparent group-hover:border-outline-variant/30" placeholder="검색하거나 직접 입력..." type="text"/>
</div>
</div>
<div class="flex flex-col gap-stack-sm w-full">
<div class="flex items-center justify-between">
<label class="text-label-md text-on-surface-variant uppercase tracking-wider font-semibold">별점</label>
<span class="text-label-md text-on-surface-variant/70">선택</span>
</div>

<button class="star-btn text-outline-variant hover:text-primary transition-colors p-1" data-rating="1">
<span class="material-symbols-outlined text-[32px] fill-current">star</span>

<button class="star-btn text-outline-variant hover:text-primary transition-colors p-1" data-rating="2">

<span class="material-symbols-outlined text-[32px] fill-current">star</span>
</button>

</button>

<span class="material-symbols-outlined text-[32px] fill-current">star</span>
</button>
<span class="ml-2 text-title-lg text-primary font-bold hidden" id="rating-display">0</span>
</div>

<label class="text-label-md text-on-surface-variant uppercase tracking-wider font-semibold">리뷰</label>
<textarea class="w-full bg-[#F1F5F9] text-on-surface p-4 rounded-xl text-body-lg focus:outline-none focus:ring-1 focus:ring-primary focus:bg-surface transition-all resize-none placeholder:text-on-surface-variant/50 border border-transparent hover:border-outline-variant/30 leading-relaxed" placeholder="책에 대한 생각을 자유롭게 적어주세요..." rows="6"></textarea>
</div>
<div class="flex flex-col gap-stack-sm w-full">
<label class="text-label-md text-on-surface-variant uppercase tracking-wider font-semibold">완독일</label>
<div class="relative w-full group">
<div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
<span class="material-symbols-outlined text-on-surface-variant text-[20px]">calendar_today</span>
</div>
<input class="w-full bg-[#F1F5F9] text-on-surface pl-12 pr-4 py-3 rounded-xl text-body-md focus:outline-none focus:ring-1 focus:ring-primary focus:bg-surface transition-all border border-transparent group-hover:border-outline-variant/30 font-medium" id="date-picker" type="date"/>
</div>
</div>
</div>
<div class="fixed bottom-0 left-0 w-full p-margin-mobile bg-surface/90 backdrop-blur-md pb-safe">
<button class="w-full bg-primary text-on-primary font-title-lg py-4 rounded-xl flex items-center justify-center gap-2 hover:bg-primary/90 active:scale-[0.98] transition-all shadow-md shadow-primary/20">
<span class="material-symbols-outlined text-[20px]">check</span>
    저장하기
  </button>
</div>
<script>
  document.addEventListener('DOMContentLoaded', () => {
    
    document.getElementById('date-picker').valueAsDate = new Date();

    const subPathData = {
      subscription: ['밀리의서재', '리디셀렉트', '윌라', '교보 SAM'],
      online: ['YES24', '알라딘', '교보문고']
    };

    const chips = document.querySelectorAll('.acq-chip');
    const subPathSection = document.getElementById('sub-path-section');
    const subPathChipsContainer = document.getElementById('sub-path-chips');

    chips.forEach(chip => {
      chip.addEventListener('click', (e) => {
        
        chips.forEach(c => {
          c.classList.remove('bg-primary-container', 'text-on-primary-container', 'font-bold');
          c.classList.add('bg-surface-container', 'text-on-surface');
        });
        
        e.target.classList.remove('bg-surface-container', 'text-on-surface');
        e.target.classList.add('bg-primary-container', 'text-on-primary-container', 'font-bold');

        const value = e.target.dataset.value;
        if (subPathData[value]) {
          subPathSection.classList.remove('hidden');
          subPathChipsContainer.innerHTML = subPathData[value].map(name => 
            `<button class="sub-chip px-3 py-1.5 bg-surface-container-high text-on-surface rounded-full text-label-md transition-colors border border-transparent hover:border-primary/20 focus:outline-none">${name}</button>`
          ).join('');
          
          document.querySelectorAll('.sub-chip').forEach(subChip => {
             subChip.addEventListener('click', (ev) => {
                 document.querySelectorAll('.sub-chip').forEach(c => {
                     c.classList.remove('bg-primary/10', 'text-primary', 'font-bold', 'border-primary/20');
                     c.classList.add('bg-surface-container-high', 'text-on-surface');
                 });
                 ev.target.classList.remove('bg-surface-container-high', 'text-on-surface');
                 ev.target.classList.add('bg-primary/10', 'text-primary', 'font-bold', 'border-primary/20');
             });
          });
        } else {
          subPathSection.classList.add('hidden');
        }
      });
    });

    const stars = document.querySelectorAll('.star-btn');
    const ratingDisplay = document.getElementById('rating-display');
    
    stars.forEach(star => {
      star.addEventListener('click', (e) => {
        const rating = parseInt(e.currentTarget.dataset.rating);
        stars.forEach(s => {
          const sRating = parseInt(s.dataset.rating);
          const icon = s.querySelector('span');
          if (sRating <= rating) {
            s.classList.remove('text-outline-variant');
            s.classList.add('text-primary');
            icon.style.fontVariationSettings = "'FILL' 1";
          } else {
            s.classList.remove('text-primary');
            s.classList.add('text-outline-variant');
            icon.style.fontVariationSettings = "'FILL' 0";
          }
        });
        ratingDisplay.textContent = rating;
        ratingDisplay.classList.remove('hidden');
        
        // Add a little pop animation
        e.currentTarget.classList.add('scale-125');
        setTimeout(() => e.currentTarget.classList.remove('scale-125'), 150);
      });
    });
  });
</script></main></body></html>
